name: MCP tests

on:
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-tests.yml"
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-tests.yml"

permissions:
  contents: read

jobs:
  mcp-tests:
    name: Python 3.12 and FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp/requirements.lock
            mcp/pyproject.toml
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Install MCP dependencies
        run: python -m pip install -r requirements.lock -e .
      - name: Run tests without model downloads
        run: python -m unittest discover -s tests -v
