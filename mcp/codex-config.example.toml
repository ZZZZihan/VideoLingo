# Run scripts/configure_codex.py to generate real absolute paths in .codex/config.toml.
[mcp_servers.videolingo]
command = "/ABSOLUTE/PROJECT/PATH/.venv/bin/python"
args = ["-m", "videolingo_mcp"]
cwd = "/ABSOLUTE/PROJECT/PATH"
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.videolingo.env]
VIDEOLINGO_DATA_DIR = "/ABSOLUTE/PROJECT/PATH/.videolingo"
# Include the directories containing your ffmpeg and ffprobe executables.
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
