[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videolingo-mcp"
version = "0.1.0"
description = "Local video transcription and subtitle tools for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
# faster-whisper 1.2.1 uses av.open(metadata_errors=...), removed in PyAV 19.
asr = ["faster-whisper==1.2.1", "av>=11,<19"]

[project.scripts]
videolingo-mcp = "videolingo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
